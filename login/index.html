<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#F7F3EE">
<title>Sign in · Daxator Packages</title>
<link rel="icon" href="/favicon.ico">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="stylesheet" href="/assets/base.css">
<style>
body{display:grid;place-items:center;min-height:100vh;padding:20px}
.card{width:100%;max-width:400px;border-radius:28px;padding:34px 28px 28px;text-align:center;animation:pop .7s var(--spring)}
.card img{height:58px;margin:0 auto 6px;display:block}
.card h1{font-family:var(--serif);font-weight:700;font-size:22px;letter-spacing:.04em;margin:14px 0 4px}
.card p{color:var(--muted);font-size:14px;margin:0 0 22px}
.pw{position:relative;text-align:left}
.pw .in{padding-right:48px;font-size:16px;height:52px}
.eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:40px;height:40px;border:0;background:transparent;border-radius:10px;display:grid;place-items:center}
.eye svg{width:20px;height:20px;stroke:var(--muted);fill:none;stroke-width:1.8}
.rem{display:flex;align-items:center;gap:10px;margin:16px 2px 20px;font-size:14px;font-weight:600;text-align:left;cursor:pointer}
.err{color:var(--red);font-size:13.5px;font-weight:700;min-height:20px;margin-top:10px}
.shake{animation:shake .5s}
.lock{width:54px;height:54px;border-radius:18px;margin:0 auto 4px;display:grid;place-items:center;background:var(--tint)}
.lock svg{width:24px;height:24px;stroke:var(--brown);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.setup{text-align:left;font-size:13.5px;line-height:1.55;background:var(--amber-t);border-radius:16px;padding:14px 16px;margin-top:16px;color:#5a4211}
.setup ol{margin:6px 0 0;padding-left:18px}
.foot{margin-top:18px;color:var(--muted);font-size:12px}
</style>
</head>
<body>
<div class="bgfx"><i></i><i></i><i></i></div><div class="grain"></div>
<form class="card glass" id="f" autocomplete="on">
  <img src="/assets/logo.png" alt="Daxator Studios">
  <h1>Packages &amp; Billing</h1>
  <p>Private area. Enter your password to continue.</p>
  <input type="text" name="username" value="daxator" autocomplete="username" hidden>
  <div class="pw"><input class="in" id="pw" name="password" type="password" placeholder="Password" autocomplete="current-password" required autofocus>
    <button type="button" class="eye" id="eye" aria-label="Show password"><svg viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button></div>
  <label class="rem"><span class="tg"><input type="checkbox" id="rem" checked><i></i></span>Keep me signed in for 30 days</label>
  <button class="btn dark full" id="go" style="height:50px;font-size:15px">Sign in</button>
  <div class="err" id="err"></div>
  <div class="setup hidden" id="setup"><b>One-time setup needed</b>
    <ol><li>Open your project on <b>vercel.com</b> → <b>Settings</b> → <b>Environment Variables</b>.</li>
    <li>Add <b>APP_PASSWORD</b> with the password you want.</li>
    <li>Go to <b>Deployments</b> → latest → <b>⋯ → Redeploy</b>.</li></ol></div>
  <div class="foot">Daxator Studios</div>
</form>
<script>
const $=id=>document.getElementById(id);
const qs=new URLSearchParams(location.search);
if(qs.get('setup'))$('setup').classList.remove('hidden');
$('eye').onclick=()=>{const p=$('pw');p.type=p.type==='password'?'text':'password';p.focus()};
$('f').onsubmit=async e=>{e.preventDefault();const b=$('go');b.disabled=true;b.innerHTML='<span class="spin"></span>';$('err').textContent='';
  try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:$('pw').value,remember:$('rem').checked}),credentials:'same-origin'});
    const j=await r.json().catch(()=>({}));
    if(r.ok){b.innerHTML='✓';let next=qs.get('next')||'/';if(!next.startsWith('/')||next.startsWith('//')||next.startsWith('/login'))next='/';location.replace(next);return}
    $('err').textContent=j.error||'Could not sign in';if(r.status===500)$('setup').classList.remove('hidden');
    $('f').classList.remove('shake');void $('f').offsetWidth;$('f').classList.add('shake');$('pw').select();
  }catch(er){$('err').textContent='No connection. Try again.'}
  b.disabled=false;b.textContent='Sign in'};
</script>
</body>
</html>
