<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F7F3EE">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dax Packages">
<title>Daxator Packages</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/favicon.ico">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="preload" href="/assets/fonts/manrope-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/assets/fonts/cinzel-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/base.css">
<link rel="stylesheet" href="/app/app.css">
</head>
<body>
<div class="bgfx"><i></i><i></i><i></i></div><div class="grain"></div>

<div class="shell">
  <aside class="side glass">
    <div class="brand"><img src="/assets/logo.png" alt="Daxator Studios"><div><small>Packages &amp; billing</small></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="sec">Quick actions</div>
    <div class="quick">
      <button class="btn" data-act="new-invoice"><svg viewBox="0 0 24 24"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M9 13h6M9 17h4"/></svg>New invoice</button>
      <button class="btn" data-act="new-custom"><svg viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 1 1 3 3L7 19l-4 1 1-4z"/></svg>Custom invoice</button>
      <button class="btn" data-act="new-agreement"><svg viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 1 1 3 3L7 19l-4 1 1-4z"/></svg>New agreement</button>
      <button class="btn" data-act="share"><svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg>Share packages</button>
      <button class="btn" data-act="calc"><svg viewBox="0 0 24 24"><rect x="5" y="2.5" width="14" height="19" rx="2.5"/><path d="M8.5 6.5h7M8.5 11h.01M12 11h.01M15.5 11h.01M8.5 14.5h.01M12 14.5h.01M15.5 14.5h.01M8.5 18h.01M12 18h3.5"/></svg>Calculator</button>
    </div>
    <div class="foot">
      <a class="btn ghost" href="/api/logout"><svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>Log out</a>
    </div>
  </aside>

  <div class="mainwrap">
    <header class="topbar glass">
      <img src="/assets/logo.png" alt="">
      <span class="ttl" id="ttl">Packages</span>
      <button class="ib" data-act="share" aria-label="Share packages"><svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg></button>
      <button class="ib dark" data-act="calc" aria-label="Calculator"><svg viewBox="0 0 24 24"><rect x="5" y="2.5" width="14" height="19" rx="2.5"/><path d="M8.5 6.5h7M8.5 11h.01M12 11h.01M15.5 11h.01M8.5 14.5h.01M12 14.5h.01M15.5 14.5h.01M8.5 18h.01M12 18h3.5"/></svg></button>
    </header>
    <main id="main"></main>
  </div>
</div>

<nav class="tabbar glass" id="tabbar"></nav>
<div class="savebar glass" id="savebar"><span>Unsaved settings</span><button class="btn sm" id="sbDiscard">Discard</button><button class="btn sm dark" id="sbSave">Save settings</button></div>
<div id="pa"></div>
<div class="toast" id="toast"></div>

<script src="/app/docs.js"></script>
<script src="/app/app.js"></script>
</body>
</html>
